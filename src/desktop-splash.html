    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      document.documentElement.dataset.theme = splashTheme === 'dark' ? 'dark' : 'light'
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      /* --- animation (src/splash.css) --- */
__SPLASH_CSS__
      /* --- launch-screen frame (src/desktop-splash.css) --- */

  <body>
    <div id="dss-stage" aria-hidden="true"></div>
    <div class="dss-boot" aria-live="polite">
      <h1 class="dss-boot-title" id="title">Starting DSH Desktop</h1>
      <p class="dss-boot-status" id="status">First launch may take a moment.</p>
      <!-- Launch-screen contract: this page is loaded with ?theme=dark|light and
           the shell writes its boot lines into #title/#status. DSH Desktop 0.12
           stopped writing #progress; the element stays for older launchers, and
           it is empty by design on 0.12+. -->
      <p class="dss-boot-progress" id="progress"></p>
    </div>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.getElementById('title').textContent = '正在启动 DSH Desktop'
        document.getElementById('status').textContent = '首次启动可能需要一点时间。'
      }
    </script>
